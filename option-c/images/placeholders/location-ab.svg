  <text x="400" y="260" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#3c533c">800 × 450</text>
  <text x="400" y="291" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-style="italic" fill="#3c533c">Amazing Beginnings Montessori</text>
