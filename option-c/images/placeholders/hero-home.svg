<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <title>Hero image (800 × 1000): Children learning together</title>
  <defs>
    <pattern id="stripes" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#ece5d6"/>
      <rect width="18" height="36" fill="#e4dccb"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#stripes)"/>
  <rect x="16" y="16" width="768" height="968" fill="none" stroke="#3c533c" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="24 16"/>
  <rect x="21" y="258" width="758" height="401" rx="34" fill="#ffffff" fill-opacity="0.72"/>
  <g transform="translate(338 297) scale(5.208)" fill="none" stroke="#3c533c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="18" rx="2"/>
    <circle cx="8.5" cy="9" r="2"/>
    <polyline points="21 16 15.5 10.5 5 21"/>
  </g>
  <text x="400" y="499" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="57" font-weight="700" fill="#3c533c">Hero image</text>
  <text x="400" y="559" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="41" fill="#3c533c">800 × 1000</text>
  <text x="400" y="612" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-style="italic" fill="#3c533c">Children learning together</text>
</svg>
