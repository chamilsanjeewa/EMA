<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>Staff portrait (400 × 400): Administrator &amp; CEO</title>
  <defs>
    <pattern id="stripes" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#ece5d6"/>
      <rect width="18" height="36" fill="#e4dccb"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#stripes)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#3c533c" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="12 8"/>
  <rect x="48" y="72" width="305" height="212" rx="18" fill="#ffffff" fill-opacity="0.72"/>
  <g transform="translate(167 93) scale(2.750)" fill="none" stroke="#3c533c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="18" rx="2"/>
    <circle cx="8.5" cy="9" r="2"/>
    <polyline points="21 16 15.5 10.5 5 21"/>
  </g>
  <text x="200" y="200" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="30" font-weight="700" fill="#3c533c">Staff portrait</text>
  <text x="200" y="232" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="22" fill="#3c533c">400 × 400</text>
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-style="italic" fill="#3c533c">Administrator &amp; CEO</text>
</svg>
