<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <title>Hero image (1000 × 800): Children learning together</title>
  <defs>
    <pattern id="stripes" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#fde8dc"/>
      <rect width="18" height="36" fill="#fbdccd"/>
    </pattern>
  </defs>
  <rect width="1000" height="800" fill="url(#stripes)"/>
  <rect x="16" y="16" width="968" height="768" fill="none" stroke="#8f3150" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="24 16"/>
  <rect x="101" y="144" width="798" height="422" rx="36" fill="#ffffff" fill-opacity="0.72"/>
  <g transform="translate(434 186) scale(5.500)" fill="none" stroke="#8f3150" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="18" rx="2"/>
    <circle cx="8.5" cy="9" r="2"/>
    <polyline points="21 16 15.5 10.5 5 21"/>
  </g>
  <text x="500" y="399" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="60" font-weight="700" fill="#8f3150">Hero image</text>
  <text x="500" y="462" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="43" fill="#8f3150">1000 × 800</text>
  <text x="500" y="518" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="36" font-style="italic" fill="#8f3150">Children learning together</text>
</svg>
