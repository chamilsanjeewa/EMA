name: 'EMA B: Clean & Modern'
type: theme
description: 'Option B: lots of white space, a strict grid and big type. Sub-theme of EMA Base.'
core_version_requirement: ^11
base theme: ema_base
package: EMA
screenshot: screenshot.png
libraries:
  - ema_modern/global
# Option-specific styles are added on top of each shared component library.
libraries-extend:
  core/components.ema_base--button:
    - ema_modern/button
  core/components.ema_base--main-menu:
    - ema_modern/main-menu
  core/components.ema_base--hero:
    - ema_modern/hero
  core/components.ema_base--page-header:
    - ema_modern/page-header
  core/components.ema_base--section-heading:
    - ema_modern/section-heading
  core/components.ema_base--feature-list:
    - ema_modern/feature-list
  core/components.ema_base--media-text:
    - ema_modern/media-text
  core/components.ema_base--program-card:
    - ema_modern/program-card
  core/components.ema_base--testimonial:
    - ema_modern/testimonial
  core/components.ema_base--history-timeline:
    - ema_modern/history-timeline
  core/components.ema_base--staff-card:
    - ema_modern/staff-card
  core/components.ema_base--enrollment-steps:
    - ema_modern/enrollment-steps
  core/components.ema_base--location-card:
    - ema_modern/location-card
  core/components.ema_base--gallery-grid:
    - ema_modern/gallery-grid
  core/components.ema_base--faq-accordion:
    - ema_modern/faq-accordion
  core/components.ema_base--cta-banner:
    - ema_modern/cta-banner
  core/components.ema_base--contact-info:
    - ema_modern/contact-info
regions:
  header: 'Header (branding)'
  primary_menu: 'Primary menu'
  hero: 'Hero (page title)'
  highlighted: 'Highlighted (messages, tabs)'
  content: 'Content'
  sidebar: 'Sidebar (optional)'
  footer_top: 'Footer top (call to action)'
  footer: 'Footer'
